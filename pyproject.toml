[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infinihash-kyt"
version = "0.2.2"
description = "Python SDK for the Infinihash KYT API (wallet screening, cases, SAR drafts)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Infinihash", email = "dx@infinihash.com" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://kyt.infinihash.com"
Documentation = "https://kyt.infinihash.com/docs"
Source = "https://github.com/Infinihash/infinihash-kyt"

[tool.setuptools.packages.find]
include = ["infinihash_kyt*"]
